version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: booknest-db
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booknest
      MYSQL_USER: dev
      MYSQL_PASSWORD: devpass
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
